# Файлы из conf.d подключаются внутрь блока http {}, поэтому эти настройки действуют на все сайты.

# do not show the nginx version in responses and error pages
# Убирает версию nginx из заголовка Server и со страниц ошибок, чтобы не подсказывать её сканерам.
server_tokens off;

# largest request body: login and build forms are far below this
# Максимальный размер тела запроса 1 МБ; при превышении nginx ответит 413. Совпадает со значением по умолчанию, здесь задано явно.
client_max_body_size 1m;

# Docker DNS: container names in the web network are looked up per request
# Встроенный DNS Docker для поиска контейнеров по имени; ответ кэшируется 10 секунд, IPv6-адреса не запрашиваются.
# Поиск на каждый запрос работает, только если в proxy_pass используется переменная, иначе имя резолвится один раз при старте.
resolver 127.0.0.11 valid=10s ipv6=off;

# headers for the app behind the proxy
# Ходить к приложениям по HTTP/1.1 вместо стандартного 1.0 — нужно для keep-alive и WebSocket.
proxy_http_version 1.1;
# Передаёт приложению исходный домен из запроса клиента, а не внутреннее имя контейнера.
proxy_set_header Host              $host;
# Передаёт приложению реальный IP клиента, иначе оно видело бы только IP nginx.
proxy_set_header X-Real-IP         $remote_addr;
# Добавляет IP клиента в конец цепочки прокси в заголовке X-Forwarded-For.
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# Сообщает приложению, пришёл клиент по http или https (для корректных редиректов и secure-cookies).
# Если в server или location задать хотя бы один свой proxy_set_header, эти четыре заголовка там перестанут наследоваться.
proxy_set_header X-Forwarded-Proto $scheme;

# login and signup: limit POST requests per client IP, GET is not counted
# Создаёт переменную $auth_post_key, значение которой зависит от HTTP-метода запроса.
map $request_method $auth_post_key {
    # Для POST ключом становится IP клиента в компактном двоичном виде.
    POST    $binary_remote_addr;
    # Для остальных методов ключ пустой, а запросы с пустым ключом лимит не учитывает.
    default "";
}
# Зона лимита auth_post: 10 МБ общей памяти (~160 тыс. IP), не больше 10 запросов в минуту с одного IP.
# Сама зона ничего не ограничивает — её нужно подключить через limit_req zone=auth_post; в нужном location.
limit_req_zone $auth_post_key zone=auth_post:10m rate=10r/m;
# При превышении лимита отвечать 429 Too Many Requests вместо стандартного 503.
limit_req_status 429;

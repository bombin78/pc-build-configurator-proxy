# port 80 for our names: certificate checks and redirect to https
# HTTP-сервер для наших доменов.
server {
    # Слушает порт 80; без default_server, поэтому сюда попадают только запросы с совпавшим именем.
    listen 80;
    # Домены этого блока; запросы с другими именами уходят в ловушку из 05-default.conf.
    server_name pcbuildconfig.ru www.pcbuildconfig.ru staging.pcbuildconfig.ru;

    # Путь, по которому Let's Encrypt проверяет владение доменом; обрабатывается отдельно от остального.
    location /.well-known/acme-challenge/ {
        # Отдаёт файлы из тома certbot: /.well-known/acme-challenge/abc -> /var/www/certbot/.well-known/acme-challenge/abc.
        # Здесь нет редиректа на HTTPS, потому что сертификата может ещё не быть.
        root /var/www/certbot;
    }

    # Все остальные запросы к нашим доменам.
    location / {
        # Постоянный редирект на HTTPS с тем же доменом, путём и параметрами.
        return 301 https://$host$request_uri;
    }
}

# requests by IP or with an unknown name: close the connection without a reply
# Блок-ловушка для HTTP-запросов, не подошедших ни одному сайту.
server {
    # Сервер по умолчанию на порту 80: сюда попадают запросы по голому IP и с чужими доменами.
    listen 80 default_server;
    # Специальный код nginx: закрыть соединение, ничего не отвечая.
    return 444;
}

# HTTPS with an unknown name: refuse the TLS handshake, no certificate needed
# Такая же ловушка для HTTPS.
server {
    # Сервер по умолчанию на порту 443 для TLS-подключений с неизвестным именем (SNI).
    listen 443 ssl default_server;
    # Обрывает TLS-рукопожатие до отправки сертификата, поэтому сертификат здесь не нужен и настоящий не утекает при запросе по IP.
    ssl_reject_handshake on;
}

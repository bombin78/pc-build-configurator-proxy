# www: one canonical address for the site
server {
    listen 443 ssl;
    http2 on;
    server_name www.pcbuildconfig.ru;

    ssl_certificate     /etc/letsencrypt/live/pcbuildconfig.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pcbuildconfig.ru/privkey.pem;

    return 301 https://pcbuildconfig.ru$request_uri;
}

# main site
server {
    listen 443 ssl;
    http2 on;
    server_name pcbuildconfig.ru;

    ssl_certificate     /etc/letsencrypt/live/pcbuildconfig.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pcbuildconfig.ru/privkey.pem;

    # app of the main site in the web network, looked up per request
    set $app http://pcbuild-prod:3000;

    location ~ ^/(login|signup)$ {
        limit_req zone=auth_post burst=5 nodelay;
        proxy_pass $app;
    }

    location / {
        proxy_pass $app;
    }
}

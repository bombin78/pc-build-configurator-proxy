# staging: same app setup, closed with a password
server {
    listen 443 ssl;
    http2 on;
    server_name staging.pcbuildconfig.ru;

    ssl_certificate     /etc/letsencrypt/live/pcbuildconfig.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pcbuildconfig.ru/privkey.pem;

    auth_basic           "Staging";
    auth_basic_user_file /etc/nginx/auth/staging.htpasswd;

    set $app http://pcbuild-staging:3000;

    location ~ ^/(login|signup)$ {
        limit_req zone=auth_post burst=5 nodelay;
        proxy_pass $app;
    }

    location / {
        proxy_pass $app;
    }
}

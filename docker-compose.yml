# Имя проекта Compose: используется как префикс имён контейнеров и томов (proxy-nginx-1, proxy_letsencrypt).
name: proxy

# Список контейнеров, которые поднимает этот проект.
services:
  # Сервис nginx — обратный прокси, принимающий весь внешний трафик.
  nginx:
    # Официальный образ nginx с зафиксированной версией, чтобы обновления не приходили неожиданно.
    image: nginx:1.30.6
    # Перезапускать контейнер при падении и после перезагрузки сервера, но не после ручной остановки.
    restart: unless-stopped
    # Проброс портов хоста в контейнер.
    ports:
      # HTTP: порт 80 хоста -> порт 80 контейнера.
      - "80:80"
      # HTTPS: порт 443 хоста -> порт 443 контейнера.
      - "443:443"
    # Папки и тома, монтируемые в контейнер.
    volumes:
      # Папка nginx/conf.d из этого репозитория (путь ./ отсчитывается от папки, где лежит docker-compose.yml)
      # подключается внутрь контейнера как /etc/nginx/conf.d — оттуда nginx по умолчанию читает конфиги сайтов (*.conf).
      # ro — только чтение: контейнер не может изменить файлы, а правки в репозитории видны nginx сразу (после nginx -s reload).
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Папка nginx/auth этого репозитория -> /etc/nginx/auth в контейнере, только чтение.
      # Здесь будут файлы htpasswd: логины и хеши паролей для basic auth (например, чтобы закрыть паролем staging); создаются на сервере командой htpasswd.
      # В git они не попадают (см. .gitignore); сейчас в папке только пустой .gitkeep, чтобы папка существовала в репозитории.
      - ./nginx/auth:/etc/nginx/auth:ro
      # Сертификаты Let's Encrypt из общего с certbot тома; nginx их только читает.
      - letsencrypt:/etc/letsencrypt:ro
      # Том certbot-www -> /var/www/certbot в контейнере, только чтение; certbot пишет в этот же том.
      # Здесь лежат временные файлы проверки домена: при получении или продлении сертификата certbot создаёт файл .well-known/acme-challenge/<токен>,
      # Let's Encrypt запрашивает его по http://<домен>/.well-known/acme-challenge/<токен>, nginx отдаёт его (см. 10-http.conf), и при совпадении содержимого домен считается подтверждённым.
      - certbot-www:/var/www/certbot:ro
    # Docker-сети, к которым подключён контейнер.
    networks:
      # Подключает nginx к Docker-сети web; к этой же сети подключаются контейнеры приложений.
      # Благодаря этому nginx обращается к приложениям по имени контейнера (например, proxy_pass http://app:3000), и их порты не нужно открывать наружу.
      - web
    # Команда запуска контейнера (заменяет стандартную CMD образа nginx). Разбор по частям:
    #   "/bin/sh", "-c", "..."  — запустить оболочку sh и выполнить в ней скрипт из третьего элемента списка.
    #   while :; do ... done    — бесконечный цикл; ":" — пустая команда, которая всегда завершается успешно.
    #   sleep 6h;               — подождать 6 часов.
    #   nginx -s reload;        — попросить работающий nginx перечитать конфиги и сертификаты без остановки и обрыва соединений;
    #                             только так nginx подхватывает сертификаты, продлённые certbot.
    #   &                       — запустить весь цикл в фоне, чтобы скрипт сразу перешёл к следующей команде.
    #   exec                    — заменить процесс sh процессом nginx: nginx становится главным процессом контейнера (PID 1)
    #                             и сам получает сигнал остановки от docker stop.
    #   nginx -g 'daemon off;'  — запустить nginx; -g задаёт глобальную директиву, а daemon off не даёт nginx уйти в фон
    #                             (если главный процесс уйдёт в фон, контейнер сразу завершится).
    # Побочный эффект: первый аргумент команды не "nginx", поэтому entrypoint образа пропускает скрипты /docker-entrypoint.d (шаблоны envsubst и т.п.).
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"]

  # Сервис certbot — получает и продлевает сертификаты Let's Encrypt.
  certbot:
    # Официальный образ certbot с зафиксированной версией.
    image: certbot/certbot:v5.8.0
    # Та же политика перезапуска, что и у nginx.
    restart: unless-stopped
    # Тома, монтируемые в контейнер certbot.
    volumes:
      # Сюда certbot записывает сертификаты и ключи (без ro, так как нужна запись).
      - letsencrypt:/etc/letsencrypt
      # Сюда certbot кладёт файлы-токены, по которым Let's Encrypt проверяет владение доменом.
      - certbot-www:/var/www/certbot
    # Точка входа контейнера (заменяет стандартный ENTRYPOINT образа, который запустил бы certbot один раз и завершился). Разбор по частям:
    #   "/bin/sh", "-c", "..."  — запустить оболочку sh и выполнить в ней скрипт из третьего элемента списка.
    #   trap exit TERM;         — при получении сигнала SIGTERM (его отправляет docker stop) сразу завершить скрипт.
    #                             sh здесь главный процесс контейнера (PID 1), а PID 1 без trap игнорирует SIGTERM.
    #   while :; do ... done    — бесконечный цикл.
    #   certbot renew;          — проверить все ранее полученные сертификаты и продлить те, у которых до истечения меньше 30 дней;
    #                             остальные не трогаются. Первый сертификат renew не получает — его нужно один раз выпустить вручную (certbot certonly --webroot ...).
    #   sleep 12h &             — запустить паузу на 12 часов в фоне...
    #   wait;                   — ...и дождаться её окончания. Пока sh ждёт обычную команду на переднем плане, trap сработает только после неё (через 12 часов),
    #                             а во время wait — сразу. Поэтому docker stop не ждёт 10 секунд до принудительного SIGKILL.
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew; sleep 12h & wait; done"]

# Объявление именованных томов проекта.
volumes:
  # Том с сертификатами: создаётся Docker автоматически и переживает пересоздание контейнеров.
  letsencrypt:
  # Том для файлов проверки домена, общий для nginx и certbot.
  certbot-www:

# Объявление сетей, которые используют сервисы этого проекта.
networks:
  # Сеть web — общая Docker-сеть (тип bridge) для прокси и всех приложений, которые он обслуживает.
  # Контейнеры в одной сети находят друг друга по имени через встроенный DNS Docker (127.0.0.11, см. resolver в 00-common.conf).
  # Приложение из другого compose-проекта подключается к ней так же: networks: [web] у сервиса и web: external: true в разделе networks.
  # certbot к этой сети не подключён: ему нужен только выход в интернет, который даёт сеть по умолчанию proxy_default.
  web:
    # external: true — Compose не создаёт и не удаляет эту сеть, а подключается к уже существующей с именем ровно web (без префикса proxy_).
    # Её нужно один раз создать на сервере командой docker network create web, иначе docker compose up завершится ошибкой
    # "network web declared as external, but could not be found".
    # Так сеть не зависит от прокси: docker compose down в этом проекте её не удалит, и приложения в других проектах продолжат работать.
    external: true
